<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local AI Hub</title>
    <script>
      window.__LOCAL_AI_HUB_RENDERER_READY = false;
      window.__LOCAL_AI_HUB_SHOW_FALLBACK = (title, message) => {
        const fallback = document.getElementById('local-ai-hub-fallback');
        const titleNode = document.getElementById('local-ai-hub-fallback-title');
        const messageNode = document.getElementById('local-ai-hub-fallback-message');

        if (titleNode && title) {
          titleNode.textContent = title;
        }

        if (messageNode && message) {
          messageNode.textContent = message;
        }

        if (fallback) {
          fallback.style.display = 'flex';
        }
      };

      window.setTimeout(() => {
        const root = document.getElementById('root');
        const hasVisibleUi = root && root.childElementCount > 0;
        if (window.__LOCAL_AI_HUB_RENDERER_READY || hasVisibleUi) {
          return;
        }

        window.__LOCAL_AI_HUB_SHOW_FALLBACK(
          'Local AI Hub could not load its interface.',
          'Close the app and reopen it. If this keeps happening, reinstall Local AI Hub with the latest installer.',
        );
      }, 3500);
    </script>
  </head>
  <body class="bg-shell">
    <div
      id="local-ai-hub-fallback"
      style="display:none;min-height:100vh;align-items:center;justify-content:center;background:#0a111d;color:#e7edf7;font-family:'Segoe UI Variable','Segoe UI',sans-serif;padding:24px;"
    >
      <div style="max-width:680px;border:1px solid rgba(255,255,255,0.12);border-radius:24px;background:rgba(18,29,49,0.92);padding:32px;box-shadow:0 24px 80px rgba(0,0,0,0.28);">
        <h1 id="local-ai-hub-fallback-title" style="margin:0 0 12px;font-size:28px;">Local AI Hub could not load its interface.</h1>
        <p id="local-ai-hub-fallback-message" style="margin:0;color:#cbd5e1;line-height:1.7;">
          Close the app and reopen it. If this keeps happening, reinstall Local AI Hub with the latest installer.
        </p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
