<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animated Title Card</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="scene" data-composition-id="animated-title-card" data-start="0" data-duration="5" data-width="1280" data-height="720">
    <div id="animated-title-card-scene" class="clip title-card" data-start="0" data-duration="5" data-track-index="0">
      <p class="eyebrow">Local AI Hub</p>
      <h1>HyperFrames Project</h1>
      <p class="subtitle">Animated title card template</p>
    </div>
  </main>
  <script>window.__timelines = window.__timelines || {}; window.__timelines['animated-title-card'] = window.__timelines['animated-title-card'] || { totalTime: function () { return 1; }, pause: function () {}, seek: function () { return this; } };</script>
  <script src="./script.js"></script>
</body>
</html>
