<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lower Third Caption</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="scene" data-composition-id="lower-third-caption" data-start="0" data-duration="6" data-width="1280" data-height="720">
    <section id="lower-third-caption-scene" class="clip frame" data-start="0" data-duration="6" data-track-index="0">
      <div class="lower-third">
        <p class="name">Speaker Name</p>
        <p class="caption">A local-only lower third for short explainers.</p>
      </div>
    </section>
  </main>
  <script>window.__timelines = window.__timelines || {}; window.__timelines['lower-third-caption'] = window.__timelines['lower-third-caption'] || { totalTime: function () { return 1; }, pause: function () {}, seek: function () { return this; } };</script>
  <script src="./script.js"></script>
</body>
</html>
