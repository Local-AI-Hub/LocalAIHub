<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'none'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none';" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Select recording region</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; cursor: crosshair; user-select: none; }
    body { background: rgba(2, 8, 18, 0.68); }
    .instructions { position: fixed; top: 24px; left: 50%; z-index: 4; width: min(620px, calc(100% - 48px)); transform: translateX(-50%); border: 1px solid rgba(148, 197, 255, 0.45); border-radius: 18px; background: rgba(7, 17, 31, 0.94); padding: 16px 18px; color: #f8fbff; box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45); cursor: default; }
    .instructions-row { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    h1 { margin: 0; font-size: 17px; }
    p { margin: 6px 0 0; color: #c4d3e7; font-size: 13px; line-height: 1.45; }
    button { border: 1px solid rgba(255,255,255,0.22); border-radius: 10px; background: rgba(255,255,255,0.08); color: white; padding: 9px 14px; cursor: pointer; }
    button:hover { background: rgba(255,255,255,0.16); }
    #selection-box { display: none; position: fixed; z-index: 3; border: 3px solid #5cbcff; background: rgba(56, 169, 255, 0.14); box-shadow: 0 0 0 99999px rgba(0,0,0,0.18), 0 0 28px rgba(49, 172, 255, 0.75); pointer-events: none; }
    #selection-size { position: absolute; right: -3px; bottom: -34px; border-radius: 8px; background: rgba(4, 12, 24, 0.92); padding: 5px 9px; color: white; font-size: 12px; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="instructions">
    <div class="instructions-row">
      <div>
        <h1>Drag to select a recording region</h1>
        <p id="status">Click and drag anywhere on this display. Release to apply, or press Esc to cancel.</p>
      </div>
      <button id="cancel-button" type="button">Cancel</button>
    </div>
  </div>
  <div id="selection-box"><span id="selection-size"></span></div>
  <script src="region-selection.js"></script>
</body>
</html>
